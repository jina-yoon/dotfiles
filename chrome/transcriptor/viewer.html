<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transcript</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b7280;
        --accent: #2563eb;
        --border: #e5e7eb;
        --bar: #f9fafb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181c;
          --fg: #e8e8e8;
          --muted: #9aa0a6;
          --accent: #6ea8fe;
          --border: #2a2d33;
          --bar: #1d2025;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 17px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .bar {
        position: sticky;
        top: 0;
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px 20px;
        background: var(--bar);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(6px);
      }
      .bar .spacer { flex: 1; }
      button {
        font: inherit;
        font-size: 14px;
        padding: 7px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      button.primary:hover { opacity: 0.9; color: #fff; }
      main { max-width: 760px; margin: 0 auto; padding: 32px 24px 96px; }
      h1 { font-size: 30px; line-height: 1.25; margin: 0 0 8px; }
      h2 { font-size: 22px; margin: 40px 0 12px; padding-top: 8px; border-top: 1px solid var(--border); }
      h3 { font-size: 14px; font-weight: 600; margin: 28px 0 6px; }
      h3 a { color: var(--muted); text-decoration: none; font-variant-numeric: tabular-nums; }
      h3 a:hover { color: var(--accent); }
      p { margin: 0 0 18px; }
      em { color: var(--muted); font-style: normal; }
      hr { border: none; border-top: 1px solid var(--border); margin: 20px 0 28px; }
      a { color: var(--accent); }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #111;
        color: #fff;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 14px;
        opacity: 0;
        transition: all 0.2s ease;
        pointer-events: none;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .empty { color: var(--muted); padding: 40px 0; }
    </style>
  </head>
  <body>
    <div class="bar">
      <strong>Transcript</strong>
      <span class="spacer"></span>
      <button id="copy">Copy Markdown</button>
      <button id="download" class="primary">Download .md</button>
    </div>
    <main id="content"><p class="empty">Loading…</p></main>
    <div class="toast" id="toast"></div>
    <script src="viewer.js"></script>
  </body>
</html>
